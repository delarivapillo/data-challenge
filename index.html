<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freshmen Data Analysis Challenge</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 60px; line-height: 1.5; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }

    /* Top Bar */
    header { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 16px 24px; border-bottom: 2px solid var(--card-border); sticky: top; z-index: 100; }
    .logo-area h1 { font-size: 1.3rem; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .logo-area span { font-size: 0.85rem; color: var(--text-muted); font-weight: normal; }

    .header-stats { display: flex; gap: 16px; align-items: center; }
    .stat-badge { background: #0f172a; border: 1px solid var(--card-border); padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 0.95rem; }
    .stat-badge span { color: var(--accent); }

    .timer-badge { font-family: monospace; font-size: 1.1rem; color: var(--warning); border-color: var(--warning); }

    /* Team Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
    .modal { background: var(--card-bg); border: 1px solid var(--card-border); padding: 30px; border-radius: 12px; max-width: 480px; width: 90%; }
    .modal h2 { margin-bottom: 8px; color: var(--accent); }
    .modal p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 20px; }
    .modal input { width: 100%; padding: 10px 14px; margin-bottom: 12px; background: var(--bg); border: 1px solid var(--card-border); color: var(--text); border-radius: 6px; }
    .modal button { width: 100%; padding: 12px; background: var(--accent); color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    .modal button:hover { background: var(--accent-hover); }

    /* Main Sections */
    .section-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 24px; margin-top: 24px; }
    .section-title { font-size: 1.25rem; font-weight: bold; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
    .section-desc { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px; }

    /* Challenge 1 Grid */
    .clues-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .clue-btn { background: var(--bg); border: 1px solid var(--card-border); padding: 12px; border-radius: 8px; color: var(--text); text-align: left; cursor: pointer; transition: all 0.2s; font-size: 0.88rem; position: relative; }
    .clue-btn:hover:not(:disabled) { border-color: var(--accent); }
    .clue-btn.selected { border-color: var(--accent); background: rgba(56, 189, 248, 0.1); }
    .clue-btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .clue-btn.correct { border-color: var(--success) !important; background: rgba(34, 197, 94, 0.15) !important; }
    .clue-btn.wrong { border-color: var(--danger) !important; background: rgba(239, 68, 68, 0.15) !important; }

    /* Action Buttons Part 1 Task 2 */
    .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 15px; }
    .action-card { background: var(--bg); border: 1px solid var(--card-border); padding: 14px; border-radius: 8px; cursor: pointer; text-align: left; }
    .
